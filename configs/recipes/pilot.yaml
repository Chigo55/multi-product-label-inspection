# ============================================================
# Inspection Recipe — Pilot benchmark (#33)
# ============================================================
# CONTEXT.md: Recipe는 "모든 Expected 값의 유일한 출처이며 Severity를 정하는 주체"다.
# 이 파일이 pilot의 expected_* 필드와 Label Identity 카탈로그의 정본이다.
#
# 여기 없는 것: 좌표·폰트 크기 같은 렌더링 세부. 그건 domain spec이 아니라
# 그리는 방법이라 src/utils/pilot.py 의 layout 함수가 갖는다.
#
# 이미지는 커밋하지 않는다: uv run experiments/build_pilot.py 로 재생성한다.

version: v0.1

# 제품 단위 과검률 목표 F (E1 성공 기준, reports/experiment_scenarios.md).
# 라벨 단위 f = 1 - (1-F)^(1/L) 로 역산해서 calibration에 쓴다 (L = 제품당 Label Slot 수).
product_false_reject_target: 0.01

# 제품 단위 검토 예산 R: 정상 제품 중 REVIEW로 보낼 상한 (#69 결정 3, 2026-10-27). 라벨 단위 r = 1 - (1-R)^(1/L).
# 현장 검토 인력 기준으로 다시 정한다. 바코드 합의 규칙만으로 정상 바코드 row의 약 1.8%가 REVIEW다 (Week05).
product_review_target: 0.05

# ROI 이미지 크기 (px). 한 row = 한 Label Slot의 ROI 이미지 1장.
roi_size: [256, 256]

# barcode 값은 6자다. 256px ROI 안의 Code128은 모듈당 폭이 2px 남짓이라
# 10자를 넣으면 1.4px/module이 되어 물리적으로 판독이 불가능해진다 (src/utils/pilot.py 참고).

# ------------------------------------------------------------
# Label Identity 카탈로그
# ------------------------------------------------------------
# layout: plate | tag | warning | food   (src/utils/pilot.py)
# known:  false면 onboarding되지 않은 라벨 → E3. 이 라벨이 든 unit은 test에만 둔다.
# since:  이 버전에서 추가된 라벨. 그 전 버전의 unit은 이 라벨 없이 배정해 그림이 그대로다 (#69)
# revision_of: 이 라벨의 구 revision. revision_mismatch = 이 라벨 자리에 구 revision 라벨을 붙인 것
labels:
  # --- Product A: 전장 부품 ---
  a-1:
    layout: plate
    palette: steel
    font: mono
    text: {MODEL: "XA-100", RATING: "24V 3.5A", SN: "A1-0001"}
    barcode: "XA1001"
  a-2:
    layout: plate
    palette: steel
    font: mono
    text: {MODEL: "XA-100", REV: "03", PART: "P-4471"}
    barcode: "XA1003"
  a-3:
    layout: tag
    palette: paper
    font: sans
    text: {TITLE: "A-SERIES"}
    barcode: "XA1091"
  a-4:                                   # a-2와 인쇄 문자 2글자가 다르고 바코드도 다르다 (E5-hard)
    layout: plate
    palette: steel
    font: mono
    text: {MODEL: "XA-108", REV: "04", PART: "P-4471"}
    barcode: "XA1083"
  a-5:                                   # a-2의 다음 revision. 바코드는 품번만 담아 a-2와 같고 인쇄 REV만 다르다
    layout: plate                        # (E5-hard / OCR-only — 바코드로는 구별되지 않는다)
    palette: steel
    font: mono
    text: {MODEL: "XA-100", REV: "06", PART: "P-4471"}
    barcode: "XA1003"
    revision_of: a-2
    since: "0.4"

  # --- Product B: 화학 용기 ---
  b-1:
    layout: warning
    palette: amber
    font: sans
    text: {TITLE: "WARNING", BODY: "FLAMMABLE"}
    barcode: null
  b-2:                                   # a-2와 같은 layout, 내용만 다르다 (E5-medium / cross-product similar)
    layout: plate
    palette: steel
    font: mono
    text: {MODEL: "XB-200", REV: "01", PART: "P-8820"}
    barcode: "XB2011"
  b-3:
    layout: tag
    palette: paper
    font: sans
    text: {TITLE: "B-SERIES"}
    barcode: "BX2007"
  b-4:                                   # b-3과 인쇄 문자가 완전히 같고 barcode 값만 다르다 (E5-extreme / Barcode-only)
    layout: tag
    palette: paper
    font: sans
    text: {TITLE: "B-SERIES"}
    barcode: "BX2008"

  # --- Product C: 식품 포장 ---
  c-1:                                   # a-1과 layout·palette·font가 전부 다르다 (E5-easy)
    layout: food
    palette: mint
    font: serif
    text: {NAME: "GRAIN SNACK", NET: "120 g"}
    barcode: null
  c-2:
    layout: food
    palette: mint
    font: serif
    text: {EXP: "2027-04-30", STORAGE: "COOL DRY"}
    barcode: null
  c-3:
    layout: tag
    palette: paper
    font: sans
    text: {TITLE: "CF-300"}
    barcode: "CF3014"
  c-4:
    layout: food
    palette: mint
    font: serif
    text: {ORIGIN: "KOREA", PLANT: "PL-02"}
    barcode: null

  # --- 미등록 라벨 (E3) ---
  u-1:                                   # A의 신규 revision. 라인에는 들어왔지만 onboarding 전이다
    layout: plate
    palette: steel
    font: mono
    text: {MODEL: "XA-112", REV: "05", PART: "P-4471"}
    barcode: "XA1123"
    known: false
  u-2:                                   # C의 신규 용량 라벨
    layout: food
    palette: mint
    font: serif
    text: {NAME: "GRAIN SNACK", NET: "150 g"}
    barcode: null
    known: false

# ------------------------------------------------------------
# Product Type별 Recipe
# ------------------------------------------------------------
# slots:     Label Slot의 제품 좌표계 기준 기대 위치 (mm)
# tolerance: 이 안이면 정상. 넘으면 wrong_position / wrong_orientation (#34)
# revisions: revision → Label Slot별 expected Label Identity.
#            미등록 라벨이 들어간 revision은 test split에만 배정된다.
products:
  A:
    name: 전장 부품
    body: brushed_metal
    tolerance: {xy_mm: 1.5, theta_deg: 3.0}
    slots:
      slot-1: {x: 30.0, y: 20.0, theta: 0.0}
      slot-2: {x: 30.0, y: 60.0, theta: 0.0}
      slot-3: {x: 30.0, y: 95.0, theta: 0.0}
    revisions:
      "03": {slot-1: a-1, slot-2: a-2, slot-3: a-3}
      "04": {slot-1: a-1, slot-2: a-4, slot-3: a-3}
      "05": {slot-1: a-1, slot-2: u-1, slot-3: a-3}
      "06": {slot-1: a-1, slot-2: a-5, slot-3: a-3}   # v0.4 (a-5)
  B:
    name: 화학 용기
    body: plastic_dark
    tolerance: {xy_mm: 1.5, theta_deg: 3.0}
    slots:
      slot-1: {x: 25.0, y: 18.0, theta: 0.0}
      slot-2: {x: 25.0, y: 58.0, theta: 0.0}
      slot-3: {x: 25.0, y: 96.0, theta: 0.0}
    revisions:
      "01": {slot-1: b-1, slot-2: b-2, slot-3: b-3}
      "02": {slot-1: b-1, slot-2: b-2, slot-3: b-4}
  C:
    name: 식품 포장
    body: carton
    tolerance: {xy_mm: 2.0, theta_deg: 4.0}
    slots:
      slot-1: {x: 20.0, y: 15.0, theta: 0.0}
      slot-2: {x: 20.0, y: 45.0, theta: 0.0}
      slot-3: {x: 20.0, y: 75.0, theta: 0.0}
      slot-4: {x: 20.0, y: 100.0, theta: 0.0}
    revisions:
      "01": {slot-1: c-1, slot-2: c-2, slot-3: c-3, slot-4: c-4}
      "02": {slot-1: u-2, slot-2: c-2, slot-3: c-3, slot-4: c-4}

# ------------------------------------------------------------
# Severity override (defect_taxonomy.md §3)
# ------------------------------------------------------------
# override 단위는 `{product}.{label_slot}` 이고, OCR은 field 단위까지 내려간다.
# taxonomy의 기본 severity를 출발점으로 하고 여기 적힌 것만 덮어쓴다.
# metadata에는 override가 적용된 **최종 severity**를 기록한다 (ADR 0004).
# 키가 여러 단계로 겹치면 가장 구체적인 것이 이긴다 (src/utils/synthetic.py severity()).
severity_overrides:
  # 보관 문구 오탈자는 출하를 막을 사유가 아니다 (ocr_mismatch 기본 CRITICAL → MINOR).
  # 같은 라벨의 EXP(유통기한) 오인쇄는 기본값 CRITICAL 그대로다
  C.slot-2.ocr_mismatch.STORAGE: MINOR
  # 경고 라벨은 오염만으로도 판독 불가가 된다 (contamination 기본 MINOR → MAJOR)
  B.slot-1.contamination: MAJOR
  # 바코드 태그가 흐리면 판독이 안 돼 추적이 끊긴다 (blur 기본 MAJOR → CRITICAL)
  A.slot-3.blur: CRITICAL
  B.slot-3.blur: CRITICAL
  C.slot-3.blur: CRITICAL

# ------------------------------------------------------------
# 데이터 구성
# ------------------------------------------------------------
# LOT 규칙 (schema §4.2-2): test의 LOT은 train/val/reference와 겹칠 수 없다.
build:
  seed: 20260926
  lots:
    fit: ["L2601", "L2602"]     # train / val / reference
    test: ["L2603", "L2604"]
  units_per_product:
    reference: 60               # E2 few-shot k=50까지 뽑을 수 있어야 한다
    train: 200
    val: 120                    # L=3 → val 정상 360 row. f=0.334% 분위수 해상도 확보
    test: 100                   # 이 중 unknown_units개는 미등록 라벨 revision
  unknown_units_per_product: 20 # E3. test에만 (schema §4.2-3)

  # 불량 unit (#34). 정상 unit과 별도로 추가하고, unit마다 Label Slot 1곳에만 불량이 있다.
  # 생성기: src/utils/synthetic.py — defect_type 목록은 defect_taxonomy.md의 enum 중 일부다.
  defects:
    types:
      - wrong_label             # 같은 제품의 다른 라벨
      - wrong_product_label     # 다른 제품의 라벨
      - ocr_mismatch            # 한 field의 문자 1개
      - barcode_mismatch        # 바코드 값의 문자 1개 (인쇄 문자는 그대로)
      - wrong_position          # 허용 오차의 1.3~2배
      - wrong_orientation       # 허용 오차의 2.5~5배
      - missing_label
      - contamination
      - blur
      - unknown_visual          # 인쇄 줄무늬 탈락. taxonomy에 없는 모양
    # E4: calibration에서 본 적 없는 유형. is_known_defect=false, test에만 (schema §4.2-4)
    holdout: [unknown_visual]
    val_units_per_type: 8       # hold-out을 뺀 유형만. E4의 "본 유형" 쪽
    test_units_per_type: 24     # 3 products × 24 = 유형당 72 → escape 0건이면 95% 상한 ≤ 5% (ADR 0005)

  # E5 전용 unit (#35). 구간(easy/medium/hard/extreme)마다 72 unit을 test에만 추가한다.
  # 구간은 카탈로그에서 규칙으로 정한다 (src/utils/pilot.py similarity_tier) — 사람이 쌍을 고르지 않는다.
  # 각 unit은 Label Slot 한 곳의 라벨이 그 구간의 짝으로 바뀐 wrong_label / wrong_product_label이다.
  # 무작위 바꿔치기 불량도 같은 규칙으로 E5 태그를 받는다. 72 = escape 0건이면 95% 상한 ≤ 5%
  e5_units_per_tier: 72

  # v0.4 unit (#69 T5~T7). 위 unit 전부의 **뒤에** 붙는다 — v0.3 unit은 v0.3 카탈로그로 배정해 그림이 그대로다.
  # 새 revision("06")의 정상 unit은 split마다 기존 등록 revision 하나와 같은 수가 자동으로 붙는다.
  # 수는 전체 합이고 제품 수로 나눈다 (revision_mismatch는 revision_of가 있는 제품 수로).
  v04:
    revision_mismatch: {val: 24, test: 72}   # 구 revision 라벨을 붙인다 (a-5 자리에 a-2). E5-hard 태그도 받는다
    geom_boundary: 72           # wrong_position / wrong_orientation 각각. 허용 오차 0.9~1.2배 → 정상·불량이 섞인다
    ocr_confusable: 72          # 혼동 문자(0/O 1/I 5/S 8/B 2/Z 6/G) ocr_mismatch. 기존 ocr_mismatch는 그대로 둔다
