# ============================================================
# multi-product-label-inspection
# ============================================================
# 의존성 관리는 uv를 사용한다.
#   설치:   uv sync
#   실행:   uv run experiments/week01_mlflow_hello.py
#   추가:   uv add <pkg>  /  uv add --dev <pkg>
#
# PyTorch는 하드웨어(CUDA 버전)에 따라 설치 방법이 달라지므로
# 여기에 고정하지 않는다. https://pytorch.org/get-started/locally/ 참고.
#   CPU:  uv add torch torchvision --index https://download.pytorch.org/whl/cpu
#   CUDA: uv add torch torchvision --index https://download.pytorch.org/whl/cu124

[project]
name = "multi-product-label-inspection"
version = "0.1.0"
description = "다품종 라벨 검사 — Multi-product / Multi-label industrial inspection research"
requires-python = ">=3.12"

dependencies = [
    # --- 실험 추적 / 설정 ---
    "mlflow>=2.16",
    "PyYAML>=6.0",
    # --- 수치 / 평가 ---
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",                 # Clopper-Pearson 신뢰구간
    "matplotlib>=3.8",
    # --- 이미지 ---
    "Pillow>=10.3",
    "python-barcode>=0.16.1",
]

[project.optional-dependencies]
# Week 2 이후 단계에서 활성화한다 (uv sync --extra <name>)
cv = ["opencv-python-headless>=4.10"]          # registration / template matching

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
    "pyrefly>=1.3",
]

[tool.uv]
# src/ 를 배포 패키지로 빌드하지 않는다. 의존성만 관리하는 virtual project.
package = false

# ------------------------------------------------------------
# pytest
# ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]              # tests에서 `import src.utils.mvtec` 가능하게
addopts = "-q --strict-markers"
markers = [
    "slow: 데이터셋 다운로드나 모델 학습이 필요한 느린 테스트",
]

# ------------------------------------------------------------
# ruff  (linter + formatter — black/flake8/isort를 모두 대체)
# ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "mlartifacts", "datasets"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "NPY",      # NumPy 전용 규칙
    "RUF",
]
ignore = [
    "E501",     # line length는 formatter가 처리한다
]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["T201"]      # 실험 스크립트의 print는 허용

# ------------------------------------------------------------
# pyrefly (type checker)
# ------------------------------------------------------------
[tool.pyrefly]
project-includes = ["src", "experiments", "tests"]
project-excludes = ["**/.venv/**", "notebooks", "mlartifacts", "datasets"]
# `src/__init__.py` 가 있어 `src` 자체가 패키지다 (`from src.utils.mvtec import ...`).
# 표준 src-layout이 아니므로 import root를 저장소 루트로 고정한다 — pytest의
# `pythonpath = ["."]` 와 같은 규약.
# `experiments`는 스크립트를 직접 실행할 때 자기 디렉터리가 sys.path에 들어가는 것을 반영한다
# (`from _bootstrap import REPO_ROOT`).
search-path = [".", "experiments"]
python-version = "3.12.3"
